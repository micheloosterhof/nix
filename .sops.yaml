# ABOUTME: sops recipient rules: which age keys can read which secrets/ file.
# ABOUTME: Hosts use their SSH host key (ssh-to-age); michel-se is the Mac's
# Secure Enclave editing identity (age-plugin-se, Touch ID-gated). The
# recovery recipients are fido2-hmac YubiKeys (identities in keys/,
# decryption needs the physical key + its FIDO2 PIN). After any recipient
# change, re-encrypt with `sops updatekeys secrets/*.yaml`.
keys:
  - &michel-se age1se1q2jch5jugdc3ukfl6atuhyz608u9zlxcn7d6v2ad2vel0yg0unj768vhyw0
  - &recovery-yubikey-1 age1d9g97py25a6txkstd0zste4d7t53c9ngvvenn2y8t6ay3kw59gwqv7d90g
  - &recovery-yubikey-2 age150uqx2ft6njslr4wv2mfsq70wjfm99egs798jdl2mfeewwdrsftsh7e2yr
  - &host-nitrogen age1p6v66mmncjtddtfxfff3ckwx07tlxg4e6e432wgfc8wkupxz84nq07c0ep
  - &host-neon age12q23653w5vahhk39gy57sscdakz7kp94rvg9fa7h58wl3cn5pafqepddck
creation_rules:
  - path_regex: secrets/nitrogen\.yaml$
    key_groups:
      - age:
          - *michel-se
          - *recovery-yubikey-1
          - *recovery-yubikey-2
          - *host-nitrogen
  - path_regex: secrets/neon\.yaml$
    key_groups:
      - age:
          - *michel-se
          - *recovery-yubikey-1
          - *recovery-yubikey-2
          - *host-neon
