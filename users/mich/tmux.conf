# rebind C-l as prefix
set -g prefix C-l
set -g mouse on
bind a send-prefix
unbind C-b

bind Space next-window
bind C-a last-window

setw -g remain-on-exit on
bind Enter respawn-window
bind q kill-window

# Start windows and panes at 1, not 0
set -g base-index 1

# Automatically renumber the windows when we delete windows
set-option -g renumber-windows on

set -g set-titles on
set -g default-terminal "screen-256color"
setw -g mode-keys vi
setw -g monitor-activity on

set -g visual-bell on
set -g bell-action current

set -g history-limit 10000

# Forward modified keys (Shift+Enter, Ctrl+Enter, ...) to applications in
# the CSI u encoding so TUIs can tell them apart from plain keys.
set -g extended-keys on
set -g extended-keys-format csi-u

# Advertise OSC-8 hyperlink support and pass application escape sequences
# (OSC 133 prompt marks, OSC 7 cwd reports) through to the outer terminal.
set -ga terminal-features "*:hyperlinks"
set -g allow-passthrough on

# Jump between shell prompts in copy mode; relies on the OSC-133 marks
# emitted by the shell (zshrc/bashrc).
bind -T copy-mode-vi [ send-keys -X previous-prompt
bind -T copy-mode-vi ] send-keys -X next-prompt

#set -g status-bg black
#set -g status-fg cyan

#### COLOUR (Solarized dark)

# default statusbar colors
set -g status-bg black #base02
set -g status-fg yellow #yellow

# pane number display
set -g display-panes-active-colour blue #blue
set -g display-panes-colour red #orange

# clock
setw -g clock-mode-colour green #green
