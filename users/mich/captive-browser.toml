# ABOUTME: captive-browser config: logs into captive portals with a throwaway
# ABOUTME: Chrome instance, resolving DNS via DHCP so Tailscale DNS can't break it.

# browser is the shell (/bin/sh) command executed once the proxy starts.
# When browser exits, the proxy exits. An extra env var PROXY is available.
#
# A separate Chrome instance in Incognito mode, so that it can run (and be
# waited for) alongside the default one, and so it maintains no state
# across runs.
browser = """
    open -n -W -a "Google Chrome" --args \
    --user-data-dir="$HOME/Library/Application Support/Google/Captive" \
    --proxy-server="socks5://$PROXY" \
    --host-resolver-rules="MAP * ~NOTFOUND , EXCLUDE localhost" \
    --no-first-run --new-window --incognito \
    http://example.com
"""

# dhcp-dns is the shell (/bin/sh) command executed to obtain the DHCP
# DNS server address (en0 is the MacBook's wifi interface). The first
# match of an IPv4 regex is used.
dhcp-dns = "ipconfig getoption en0 domain_name_server"

# socks5-addr is the listen address for the SOCKS5 proxy server.
socks5-addr = "localhost:1666"
