# Build every host closure on a natively matching runner, so a green check
# means each machine provably builds — not just evaluates (check.yml).
# Substitutes from cache.nixos.org plus the personal cachix cache;
# --fallback builds locally if a path is missing from both.
#
# neon depends on the cachix cache holding the customized linux-builder
# image (an aarch64-linux derivation a macOS runner cannot build). After a
# flake.lock bump changes that image, run `make cachix/seed` from the Mac —
# until then the neon job fails on the missing image, which is the signal.
name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  closure:
    name: ${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: vm-aarch64-fusion
            runner: ubuntu-24.04-arm
            attr: nixosConfigurations.vm-aarch64-fusion.config.system.build.toplevel
          - host: vm-aarch64-utm
            runner: ubuntu-24.04-arm
            attr: nixosConfigurations.vm-aarch64-utm.config.system.build.toplevel
          - host: vm-aarch64-apple
            runner: ubuntu-24.04-arm
            attr: nixosConfigurations.vm-aarch64-apple.config.system.build.toplevel
          - host: wsl
            runner: ubuntu-latest
            attr: nixosConfigurations.wsl.config.system.build.toplevel
          - host: helium
            runner: ubuntu-latest
            attr: nixosConfigurations.helium.config.system.build.toplevel
          - host: oxygen
            runner: ubuntu-latest
            attr: nixosConfigurations.oxygen.config.system.build.toplevel
          - host: neon
            runner: macos-latest
            attr: darwinConfigurations.neon.system
          # Cloud image family: assembled by systemd-repart (no VM, no KVM),
          # so both arches build on stock runners.
          - host: gce-image-x86_64
            runner: ubuntu-latest
            attr: packages.x86_64-linux.gce-image
          - host: gce-image-aarch64
            runner: ubuntu-24.04-arm
            attr: packages.aarch64-linux.gce-image
    steps:
      - uses: actions/checkout@v5

      # The token avoids GitHub API rate limits when fetching flake inputs.
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            extra-substituters = https://micheloosterhof.cachix.org
            extra-trusted-public-keys = micheloosterhof.cachix.org-1:A80V0fr3ruUDRZtyNLGQLNCi9pL5aYyr4r9IfA590xA=

      - name: build system closure
        run: |
          nix build -L --fallback --no-link --print-out-paths ".#${{ matrix.attr }}"
