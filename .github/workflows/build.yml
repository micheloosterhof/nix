# Build every host closure on a natively matching runner, so a green check
# means each machine provably builds — not just evaluates (check.yml).
# Substitutes from cache.nixos.org; --fallback builds anything missing.
#
# neon is covered by evaluation alone (the eval-tests flake check forces its
# toplevel on every push): its closure pulls in the customized linux-builder
# image, an aarch64-linux derivation a macOS runner cannot build without a
# Linux builder, and feeding that across venues costs more than proving the
# Mac builds is worth (docs/build-venues.md).
#
# On flake-lock/* branches each host job also realizes main's closure and
# diffs the two; the closures job collects the diffs into one PR comment so
# a lock bump can be reviewed by what actually changes on each machine.
name: build

on:
  push:
  workflow_dispatch:

# contents: write is for the dependency-graph snapshot submission on the
# nitrogen job; the token never pushes.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  closure:
    name: ${{ matrix.host }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: vm-aarch64-fusion
            runner: ubuntu-24.04-arm
            attr: nixosConfigurations.vm-aarch64-fusion.config.system.build.toplevel
          - host: vm-aarch64-utm
            runner: ubuntu-24.04-arm
            attr: nixosConfigurations.vm-aarch64-utm.config.system.build.toplevel
          - host: vm-aarch64-apple
            runner: ubuntu-24.04-arm
            attr: nixosConfigurations.vm-aarch64-apple.config.system.build.toplevel
          - host: wsl
            runner: ubuntu-latest
            attr: nixosConfigurations.wsl.config.system.build.toplevel
          - host: helium
            runner: ubuntu-latest
            attr: nixosConfigurations.helium.config.system.build.toplevel
          - host: nitrogen
            runner: ubuntu-latest
            attr: nixosConfigurations.nitrogen.config.system.build.toplevel
          # Cloud image family: assembled by systemd-repart (no VM, no KVM),
          # so both arches build on stock runners.
          - host: gce-image-x86_64
            runner: ubuntu-latest
            attr: packages.x86_64-linux.gce-image
          - host: gce-image-aarch64
            runner: ubuntu-24.04-arm
            attr: packages.aarch64-linux.gce-image
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        if: startsWith(github.ref, 'refs/heads/flake-lock/')
        with:
          ref: main
          path: base

      # The repart image build runs `unshare --map-root-user` inside the Nix
      # sandbox; Ubuntu 24.04's AppArmor default strips capabilities from
      # unprivileged user namespaces, failing the uid_map write. Lift the
      # restriction on Linux runners so systemd-repart can assemble images.
      - name: allow unprivileged user namespaces
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # The token avoids GitHub API rate limits when fetching flake inputs.
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: build system closure
        run: |
          nix build -L --fallback --no-link --print-out-paths ".#${{ matrix.attr }}"

      # Submit nitrogen's closure to GitHub's dependency graph, so advisories
      # cover the deployed system, not just the flake inputs. Riding the
      # matrix build here reuses the closure this job just built. The nix
      # build is a cache hit that only resolves the store path.
      - name: submit dependency snapshot
        if: matrix.host == 'nitrogen' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          path=$(nix build --no-link --print-out-paths ".#${{ matrix.attr }}")
          ./.github/scripts/nix-deps-snapshot.sh "${{ matrix.host }}" "$path" > snapshot.json
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GH_REPO/dependency-graph/snapshots" \
            --input snapshot.json

      # gce-image outputs are compressed artifacts whose closures carry no
      # references, so a diff says nothing — skip them.
      - name: diff closure against main
        if: startsWith(github.ref, 'refs/heads/flake-lock/') && !startsWith(matrix.host, 'gce-image')
        run: |
          set -euo pipefail
          new=$(nix build --no-link --print-out-paths ".#${{ matrix.attr }}")
          old=$(nix build --fallback --no-link --print-out-paths "./base#${{ matrix.attr }}")
          # diff-closures colors unconditionally (ignores NO_COLOR and tty)
          nix store diff-closures "$old" "$new" | perl -pe 's/\e\[[0-9;]*m//g' | tee diff.txt
          {
            echo "### ${{ matrix.host }}"
            echo '```'
            cat diff.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/heads/flake-lock/') && !startsWith(matrix.host, 'gce-image')
        with:
          name: diff-${{ matrix.host }}
          path: diff.txt

  # Single context for the main ruleset's required checks: rules list checks
  # by exact job name and the matrix names change as hosts come and go, so
  # the rule points here instead. Green iff every matrix build is green.
  closures:
    needs: closure
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.closure.result }}" = "success"

      - uses: actions/download-artifact@v8
        if: startsWith(github.ref, 'refs/heads/flake-lock/')
        with:
          pattern: diff-*
          path: diffs

      # continue-on-error keeps this required check green iff the builds are
      # green; a commenting hiccup must not block the merge.
      - name: comment closure diffs on PR
        if: startsWith(github.ref, 'refs/heads/flake-lock/')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          {
            echo "Closure diffs against main (\`nix store diff-closures\`):"
            for d in diffs/diff-*/diff.txt; do
              host=$(basename "$(dirname "$d")")
              echo
              echo "<details><summary>${host#diff-}</summary>"
              echo
              echo '```'
              cat "$d"
              echo '```'
              echo '</details>'
            done
          } > comment.md
          pr=$(gh pr list --head "$GITHUB_REF_NAME" --json number --jq '.[0].number')
          if [ -n "$pr" ]; then
            # --edit-last keeps the diffs of the current lock, not a thread of
            # every lock the reused bump branch has carried.
            gh pr comment "$pr" --body-file comment.md --edit-last --create-if-none
          fi
