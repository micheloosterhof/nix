# Weekly flake.lock bump as a reviewable PR, with the input rev changes in
# the PR body. check/build runs are dispatched onto the branch explicitly
# because pushes made with GITHUB_TOKEN do not trigger on-push workflows.
name: update-lock

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The token avoids GitHub API rate limits when fetching flake inputs.
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: bump lock, open PR, dispatch CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp flake.lock "$RUNNER_TEMP/flake.lock.old"
          nix flake update 2>&1 | tee update.log
          if git diff --quiet -- flake.lock; then
            echo "flake.lock already at branch tips; nothing to do"
            exit 0
          fi
          branch="flake-lock/$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add flake.lock
          git commit -m "chore(flake): update inputs"
          git push -u origin "$branch"
          {
            echo "Automated weekly flake.lock bump."
            echo
            echo "| input | old | new | changes |"
            echo "|---|---|---|---|"
            jq -r --slurpfile old "$RUNNER_TEMP/flake.lock.old" '
              $old[0].nodes as $o | .nodes | to_entries[]
              | select(.key != "root")
              | select($o[.key].locked.rev != null and .value.locked.rev != $o[.key].locked.rev)
              | [.key, .value.locked.owner, .value.locked.repo,
                 $o[.key].locked.rev, .value.locked.rev,
                 ($o[.key].locked.lastModified | todate | .[:10]),
                 (.value.locked.lastModified | todate | .[:10])]
              | @tsv
            ' flake.lock | while IFS=$'\t' read -r name owner repo orev nrev odate ndate; do
              count=$(gh api "repos/$owner/$repo/compare/$orev...$nrev" --jq .total_commits)
              echo "| $name | \`${orev:0:11}\` $odate | \`${nrev:0:11}\` $ndate | [$count commits](https://github.com/$owner/$repo/compare/$orev...$nrev) |"
            done
            echo
            echo "Review the changes above before merging; a lock bump is a real version bump."
          } > pr-body.md
          gh pr create --title "chore(flake): weekly input bump" --body-file pr-body.md
          gh workflow run check.yml --ref "$branch"
          gh workflow run build.yml --ref "$branch"
