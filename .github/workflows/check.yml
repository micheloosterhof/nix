# CI mirror of `make lint`: nix flake check runs the nixfmt, deadnix, and
# eval-tests checks and evaluates every host configuration, so eval breakage
# (renamed file, dropped upstream attr, broken mksystem wiring) is caught on
# every push without building any system. --all-systems also evaluates the
# per-system outputs the runner's own system would skip (aarch64 packages,
# darwin checks); foreign systems are evaluated, never built.
name: check

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The token avoids GitHub API rate limits when fetching flake inputs.
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - run: nix flake check --all-systems
